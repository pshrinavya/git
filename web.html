<!DOCTYPE html>
<html lang="en">
<head>
    <title>Basic HTML and CSS</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial;
            margin: 30px;
        }

        h1 {
            color: darkblue;
            text-align: center;
        }

        h2 {
            color: green;
        }

        h3 {
            color: purple;
        }

        p {
            font-size: 18px;
            color: black;
        }

        mark {
            background-color: yellow;
        }
    </style>
</head>

<body>

    <h1>Welcome to HTML</h1>

    <h2>Introduction</h2>

    <p>
        HTML stands for <strong>HyperText Markup Language</strong>.
        It is used to create <em>web pages</em>.
    </p>

    <h3>Important HTML Tags</h3>

    <p>
        The <strong>strong</strong> tag makes text important,
        while the <em>em</em> tag emphasizes text.
    </p>

    <p>
        <mark>HTML is easy to learn!</mark>
    </p>

    <p>
        Water is written as H<sub>2</sub>O.
    </p>

</body>
</html>
